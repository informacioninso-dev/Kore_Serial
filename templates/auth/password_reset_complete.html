{% extends 'layouts/auth_bare.html' %}
{% load static %}
{% block title %}Contraseña restablecida · Kore ERP{% endblock %}
{% block auth_content %}
<div class="text-center">
  <div class="flex items-center justify-center gap-3 mb-6">
    <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-12 w-12 shrink-0">
  </div>
  <div class="mb-4 text-5xl">✅</div>
  <h1 class="mb-2 text-2xl font-bold" style="color:#134d5f">¡Contraseña actualizada!</h1>
  <p class="text-gray-500 text-sm mb-6">Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión.</p>
  <a href="{% url 'login' %}" class="inline-block rounded-lg bg-blue-600 px-6 py-2 text-sm font-medium text-white hover:bg-blue-700">
    Ir al login
  </a>
</div>
{% endblock %}
